# vhost nginx para a v3 (beta.mgfhub.com → container em 127.0.0.1:8000)
# pensado para DNS Cloudflare com proxy (nuvem laranja): a Cloudflare
# termina o TLS público (o certificado universal já cobre beta.mgfhub.com);
# a ligação Cloudflare → VPS segue o modo SSL do domínio.
#
# REGRA PRÁTICA: espelhar o server block que já serve mgfhub.com —
# mesmos `listen`/`ssl_certificate` (um certificado Cloudflare Origin CA
# cobre *.mgfhub.com, por isso o mesmo ficheiro serve) — mudando apenas
# server_name, proxy_pass e client_max_body_size.
#
# 1. copiar para /etc/nginx/sites-available/beta.mgfhub.com
# 2. ajustar o bloco conforme o vhost existente do mgfhub.com (ver nota)
# 3. ln -s /etc/nginx/sites-available/beta.mgfhub.com /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx

# --- modo SSL "Flexible" (Cloudflare → VPS em HTTP) ---
server {
    listen 80;
    server_name beta.mgfhub.com;

    # os uploads xlsx do BI-CSP/MIM@UF passam do limite default de 1m
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

