{% if aviso %}
<article class="aviso">⚠️ {{ aviso }}</article>

{% else %}
<form class="controlos" hx-get="/ide/profissional" hx-target="#ide-tabs" hx-swap="outerHTML" hx-trigger="change">
    <div class="controlos-grid">
        <label>Dados para análise
            <select name="dataset">
                {% for d in datasets %}
                <option value="{{ d }}" {% if d == dataset %}selected{% endif %}>{{ d }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Médico Familia
            <select name="medico">
                {% for m in medicos %}
                <option value="{{ m }}" {% if m == medico %}selected{% endif %}>{{ m }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
</form>

{% with chart_id="chart-profissional", fig_json=fig_profissional %}{% include "partials/chart.html" %}{% endwith %}

{% endif %}
