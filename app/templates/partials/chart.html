<div id="{{ chart_id }}" class="grafico"></div>
<script type="application/json" id="dados-{{ chart_id }}">{{ fig_json | safe }}</script>
<script>
    (function () {
        function render() {
            var el = document.getElementById("{{ chart_id }}");
            if (!el) return;
            var dados = JSON.parse(document.getElementById("dados-{{ chart_id }}").textContent);
            dados.layout = dados.layout || {};
            // deixa o gráfico preencher o contentor (dashboard responsivo)
            dados.layout.autosize = true;
            delete dados.layout.width;
            delete dados.layout.height;
            // integra no tema da app antes do 1.º render (sem flash):
            // fundo transparente + cor/fonte do texto das variáveis CSS
            if (window.mgfhubPlotlyTheme) {
                var t = window.mgfhubPlotlyTheme();
                dados.layout.paper_bgcolor = t.paper_bgcolor;
                dados.layout.plot_bgcolor = t.plot_bgcolor;
                dados.layout.font = Object.assign({}, dados.layout.font, t.font);
            }
            Plotly.newPlot(el, dados.data, dados.layout, {responsive: true, displaylogo: false});
            // ajusta ao tamanho real do contentor, coalescido por frame
            // (o ResizeObserver dispara em rajada durante o resize da janela)
            var pendente = false;
            var ajustar = function () {
                if (pendente) return;
                pendente = true;
                requestAnimationFrame(function () {
                    pendente = false;
                    if (el._fullLayout) Plotly.Plots.resize(el);
                });
            };
            ajustar();
            setTimeout(ajustar, 150);
            if (window.ResizeObserver && el.parentElement) {
                new ResizeObserver(ajustar).observe(el.parentElement);
            }
        }
        if (window.Plotly) { render(); } else { document.addEventListener("DOMContentLoaded", render); }
    })();
</script>
