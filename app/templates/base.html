<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}mgfhub{% endblock %}</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/vendor/pico.min.css?v={{ v_estatica }}">
    <link rel="stylesheet" href="/static/styles.css?v={{ v_estatica }}">
    <script src="/static/vendor/htmx.min.js?v={{ v_estatica }}" defer></script>
    <script src="/static/app.js?v={{ v_estatica }}" defer></script>
    {% block head_extra %}{% endblock %}
</head>
<body>
<button id="toggle-nav" class="toggle-nav" aria-label="Mostrar/esconder navegação">☰</button>

<aside class="nav-lateral">
    <a href="/" class="marca"><strong>mgfhub</strong></a>

    <nav aria-label="Navegação principal">
        <ul>
            <li><a href="/">🏠 Início</a></li>
            <li><a href="/indicadores">🔎 Indicadores</a></li>
            <li><a href="/ide">📊 IDE</a></li>
        </ul>
    </nav>

    <div class="nav-fundo">
        {% if utilizador %}
        <a href="/conta">👤 {{ utilizador.nome.split(" ")[0] }}</a>
        <form method="post" action="/sair" class="inline">
            <button class="secondary outline btn-pequeno">Sair</button>
        </form>
        {% else %}
        <a href="/entrar" role="button" class="secondary outline btn-pequeno">Entrar</a>
        {% endif %}
        <p class="nav-legal">
            <a href="mailto:mgfhub.suporte@gmail.com">suporte</a> ·
            <a href="/privacidade">privacidade</a> ·
            <a href="/termos">termos</a>
        </p>
    </div>
</aside>

<main class="conteudo">
    {% block content %}{% endblock %}
</main>
</body>
</html>
